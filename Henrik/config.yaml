# All pipeline settings. Scripts have no defaults: the Snakefile passes every value from here.

gwas_url: https://ftp.ebi.ac.uk/pub/databases/gwas/releases/latest/gwas-catalog-associations_ontology-annotated-full.zip
p_threshold: 5.0e-8       # genome-wide significance

first_year: 2010          # replay: graph at year Y = edges first reported in or before Y
last_year: 2025

dim: 64                   # embedding dimensions, shared by SNPs, genes and phenotypes
lambda: 1.0               # L2 regularization on all embeddings
n_iter: 20                # alternating least squares iterations per year, warm-started from the previous year
seed: 42                  # initial embeddings
min_relative_norm: 1.0e-3 # skip drift for entities whose embedding norm is below this x the median of their type
